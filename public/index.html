<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#050507">
<title>Anonymous AI</title>

<style>
*{box-sizing:border-box}

:root{
  --accent:#8060ff;
  --accent2:#389bff;
  --bg:#050507;
  --panel:rgba(15,15,19,.72);
  --text:#f5f5f7;
  --muted:#85858f;
  --border:rgba(255,255,255,.09);
}

body{
  margin:0;
  height:100vh;
  overflow:hidden;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,"Noto Sans JP","Yu Gothic",sans-serif;
}

button,textarea{font:inherit}

.background{
  position:fixed;
  inset:0;
  overflow:hidden;
  pointer-events:none;
  background:
    radial-gradient(circle at 50% 20%,rgba(110,70,255,.12),transparent 32%),
    radial-gradient(circle at 10% 90%,rgba(0,150,255,.08),transparent 28%);
}

.orb{
  position:absolute;
  width:420px;
  height:420px;
  border-radius:50%;
  filter:blur(110px);
  opacity:.25;
  animation:float 12s ease-in-out infinite;
}

.orb.one{
  background:var(--accent);
  top:-200px;
  left:15%;
}

.orb.two{
  background:var(--accent2);
  right:0;
  bottom:-220px;
  animation-delay:-5s;
}

@keyframes float{
  50%{transform:translate(40px,25px)}
}

.app{
  position:relative;
  z-index:1;
  display:flex;
  height:100vh;
}

.sidebar{
  width:250px;
  padding:22px 15px;
  border-right:1px solid var(--border);
  background:rgba(5,5,7,.6);
  backdrop-filter:blur(25px);
  display:flex;
  flex-direction:column;
  flex-shrink:0;
}

.brand{
  padding:5px 10px 25px;
}

.brand-title{
  font-size:19px;
  font-weight:800;
}

.brand-sub{
  margin-top:5px;
  color:var(--muted);
  font-size:10px;
  letter-spacing:1.5px;
}

.new-chat,
.settings-btn{
  width:100%;
  padding:12px 14px;
  margin-bottom:8px;
  border:1px solid var(--border);
  border-radius:12px;
  background:rgba(255,255,255,.045);
  color:white;
  text-align:left;
  cursor:pointer;
  transition:.2s;
}

.new-chat:hover,
.settings-btn:hover{
  background:rgba(255,255,255,.09);
  border-color:rgba(130,100,255,.45);
}

.history{
  flex:1;
  overflow-y:auto;
  margin-top:10px;
}

.history-item{
  display:flex;
  align-items:center;
  gap:8px;
  padding:10px;
  margin-bottom:4px;
  border-radius:10px;
  cursor:pointer;
  color:#aaaab3;
  font-size:12px;
}

.history-item:hover,
.history-item.active{
  background:rgba(255,255,255,.07);
  color:white;
}

.history-name{
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  flex:1;
}

.delete-chat{
  border:0;
  background:none;
  color:#666;
  cursor:pointer;
}

.delete-chat:hover{
  color:#ff7070;
}

.sidebar-bottom{
  padding-top:10px;
}

.main{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
}

.topbar{
  height:62px;
  padding:0 25px;
  display:flex;
  align-items:center;
  border-bottom:1px solid var(--border);
  background:rgba(5,5,7,.25);
  backdrop-filter:blur(20px);
}

.mobile-menu{
  display:none;
  margin-right:12px;
  border:0;
  background:none;
  color:white;
  font-size:22px;
}

.status{
  display:flex;
  align-items:center;
  gap:8px;
  color:#aaaab4;
  font-size:12px;
}

.status-dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--accent);
  box-shadow:0 0 14px var(--accent);
}

#chat{
  flex:1;
  overflow-y:auto;
  padding:65px 20px 160px;
}

.welcome{
  max-width:850px;
  margin:0 auto 60px;
  text-align:center;
}

.welcome-icon{
  width:65px;
  height:65px;
  margin:0 auto 27px;
  display:grid;
  place-items:center;
  border-radius:21px;
  background:linear-gradient(135deg,
    color-mix(in srgb,var(--accent) 30%,transparent),
    color-mix(in srgb,var(--accent2) 15%,transparent));
  border:1px solid rgba(150,120,255,.25);
  box-shadow:0 0 35px color-mix(in srgb,var(--accent) 18%,transparent);
  font-size:26px;
}

.welcome h1{
  margin:0;
  font-size:clamp(38px,6vw,70px);
  line-height:.95;
  letter-spacing:-4px;
  background:linear-gradient(110deg,#fff,var(--accent),var(--accent2));
  -webkit-background-clip:text;
  color:transparent;
}

.welcome p{
  color:#777782;
  font-size:13px;
  margin-top:20px;
}

.message{
  max-width:850px;
  margin:0 auto 30px;
  animation:appear .25s ease;
}

@keyframes appear{
  from{opacity:0;transform:translateY(7px)}
  to{opacity:1;transform:none}
}

.user{
  display:flex;
  justify-content:flex-end;
}

.user-bubble{
  max-width:75%;
  padding:13px 17px;
  border-radius:18px 18px 5px 18px;
  background:rgba(255,255,255,.075);
  border:1px solid var(--border);
  line-height:1.65;
  font-size:14px;
  white-space:pre-wrap;
}

.ai{
  display:flex;
  gap:13px;
}

.ai-icon{
  flex:0 0 auto;
  width:30px;
  height:30px;
  display:grid;
  place-items:center;
  border-radius:10px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  box-shadow:0 0 20px color-mix(in srgb,var(--accent) 30%,transparent);
}

.ai-content{
  padding-top:3px;
  line-height:1.75;
  font-size:14px;
  color:#e5e5e9;
  white-space:pre-wrap;
}

.copy-btn{
  margin-top:8px;
  border:1px solid var(--border);
  border-radius:7px;
  background:transparent;
  color:#777;
  padding:4px 8px;
  font-size:10px;
  cursor:pointer;
}

.copy-btn:hover{
  color:white;
}

.typing{
  color:#777;
  animation:pulse 1s infinite;
}

@keyframes pulse{
  50%{opacity:.35}
}

.input-wrapper{
  position:fixed;
  z-index:5;
  left:250px;
  right:0;
  bottom:0;
  padding:25px 20px 27px;
  background:linear-gradient(transparent,rgba(5,5,7,.94) 45%,#050507);
}

.input-box{
  max-width:850px;
  margin:auto;
  display:flex;
  align-items:flex-end;
  padding:7px 7px 7px 16px;
  border:1px solid rgba(255,255,255,.12);
  border-radius:18px;
  background:var(--panel);
  backdrop-filter:blur(25px);
  box-shadow:0 15px 50px rgba(0,0,0,.35);
  transition:.2s;
}

.input-box:focus-within{
  border-color:color-mix(in srgb,var(--accent) 55%,transparent);
  box-shadow:0 0 35px color-mix(in srgb,var(--accent) 13%,transparent);
}

textarea{
  flex:1;
  min-height:42px;
  max-height:150px;
  resize:none;
  border:0;
  outline:0;
  background:transparent;
  color:white;
  padding:10px 4px;
  font-size:14px;
}

textarea::placeholder{color:#6f6f79}

.send{
  width:42px;
  height:42px;
  border:0;
  border-radius:13px;
  cursor:pointer;
  color:white;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  box-shadow:0 0 18px color-mix(in srgb,var(--accent) 25%,transparent);
  transition:.2s;
}

.send:hover{
  transform:translateY(-2px);
  box-shadow:0 0 28px color-mix(in srgb,var(--accent) 45%,transparent);
}

.send:disabled{
  opacity:.35;
  transform:none;
}

.hint{
  max-width:850px;
  margin:8px auto 0;
  text-align:center;
  color:#4f4f59;
  font-size:10px;
}

/* 設定 */

.modal-bg{
  position:fixed;
  inset:0;
  z-index:20;
  display:none;
  place-items:center;
  background:rgba(0,0,0,.65);
  backdrop-filter:blur(10px);
}

.modal-bg.open{
  display:grid;
}

.modal{
  width:min(520px,92vw);
  max-height:85vh;
  overflow:auto;
  padding:25px;
  border:1px solid var(--border);
  border-radius:20px;
  background:rgba(18,18,22,.94);
  box-shadow:0 30px 100px rgba(0,0,0,.55);
}

.modal-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:22px;
}

.modal-header h2{
  margin:0;
  font-size:20px;
}

.close{
  border:0;
  background:none;
  color:#888;
  font-size:22px;
  cursor:pointer;
}

.setting{
  margin-bottom:22px;
}

.setting label{
  display:block;
  margin-bottom:8px;
  color:#aaa;
  font-size:12px;
}

select{
  width:100%;
  padding:11px;
  border:1px solid var(--border);
  border-radius:10px;
  background:#222229;
  color:white;
  outline:none;
}

.theme-buttons{
  display:flex;
  gap:8px;
}

.theme{
  flex:1;
  height:38px;
  border:1px solid var(--border);
  border-radius:10px;
  cursor:pointer;
}

.theme.purple{background:linear-gradient(135deg,#8060ff,#389bff)}
.theme.pink{background:linear-gradient(135deg,#ff4fa3,#845dff)}
.theme.green{background:linear-gradient(135deg,#00c896,#44aaff)}

.danger{
  width:100%;
  padding:10px;
  border:1px solid rgba(255,80,80,.25);
  border-radius:10px;
  background:rgba(255,60,60,.06);
  color:#ff8888;
  cursor:pointer;
}

@media(max-width:700px){

  .sidebar{
    position:fixed;
    z-index:15;
    left:-270px;
    top:0;
    bottom:0;
    transition:.25s;
  }

  .sidebar.open{
    left:0;
  }

  .mobile-menu{
    display:block;
  }

  .input-wrapper{
    left:0;
    padding:18px 12px calc(15px + env(safe-area-inset-bottom));
  }

  .topbar{
    padding:0 15px;
  }

  #chat{
    padding:45px 13px 145px;
  }

  .welcome h1{
    letter-spacing:-2px;
  }

  .user-bubble{
    max-width:88%;
  }
}
</style>
</head>

<body>

<div class="background">
  <div class="orb one"></div>
  <div class="orb two"></div>
</div>

<div class="app">

<aside class="sidebar" id="sidebar">

  <div class="brand">
    <div class="brand-title">Anonymous AI</div>
    <div class="brand-sub">Personal Intelligence</div>
  </div>

  <button class="new-chat" onclick="newChat()">
    ＋　新しいチャット
  </button>

  <div class="history" id="history"></div>

  <div class="sidebar-bottom">
    <button class="settings-btn" onclick="openSettings()">
      ⚙　設定
    </button>
  </div>

</aside>

<main class="main">

<header class="topbar">
  <button class="mobile-menu" onclick="toggleSidebar()">☰</button>

  <div class="status">
    <span class="status-dot"></span>
    Anonymous AI
  </div>
</header>

<div id="chat"></div>

<div class="input-wrapper">

  <div class="input-box">

    <textarea
      id="input"
      placeholder="メッセージを入力..."
      rows="1"
    ></textarea>

    <button class="send" id="send">↑</button>

  </div>

  <div class="hint">
    Enterで送信　・　Shift + Enterで改行
  </div>

</div>

</main>
</div>

<!-- 設定画面 -->

<div class="modal-bg" id="settingsModal">

<div class="modal">

<div class="modal-header">
  <h2>設定</h2>
  <button class="close" onclick="closeSettings()">×</button>
</div>

<div class="setting">

<label>AIの話し方</label>

<select id="personality">
  <option value="friendly">親しみやすい</option>
  <option value="normal">普通</option>
  <option value="professional">丁寧・専門的</option>
  <option value="short">短く簡潔</option>
</select>

</div>

<div class="setting">

<label>回答の長さ</label>

<select id="length">
  <option value="short">短め</option>
  <option value="normal">普通</option>
  <option value="long">詳しく</option>
</select>

</div>

<div class="setting">

<label>テーマカラー</label>

<div class="theme-buttons">

<button class="theme purple" onclick="setTheme('purple')"></button>
<button class="theme pink" onclick="setTheme('pink')"></button>
<button class="theme green" onclick="setTheme('green')"></button>

</div>

</div>

<div class="setting">

<label>保存されたチャット</label>

<button class="danger" onclick="clearHistory()">
すべてのチャット履歴を削除
</button>

</div>

</div>
</div>

<script>

const input=document.getElementById("input");
const send=document.getElementById("send");
const chat=document.getElementById("chat");
const historyBox=document.getElementById("history");
const sidebar=document.getElementById("sidebar");

let conversations=JSON.parse(
  localStorage.getItem("anonymous_conversations") || "[]"
);

let currentId=null;
let messages=[];

let settings=JSON.parse(
  localStorage.getItem("anonymous_settings") ||
  '{"personality":"friendly","length":"normal","theme":"purple"}'
);

const themes={
  purple:["#8060ff","#389bff"],
  pink:["#ff4fa3","#845dff"],
  green:["#00c896","#44aaff"]
};

function save(){
  localStorage.setItem(
    "anonymous_conversations",
    JSON.stringify(conversations)
  );

  localStorage.setItem(
    "anonymous_settings",
    JSON.stringify(settings)
  );
}

function renderHistory(){

  historyBox.innerHTML="";

  conversations.forEach(c=>{

    const item=document.createElement("div");
    item.className=
      "history-item"+
      (c.id===currentId?" active":"");

    const name=document.createElement("div");
    name.className="history-name";
    name.textContent=c.title;

    const del=document.createElement("button");
    del.className="delete-chat";
    del.textContent="×";

    del.onclick=(e)=>{
      e.stopPropagation();

      conversations=
        conversations.filter(x=>x.id!==c.id);

      if(currentId===c.id){
        newChat();
      }

      save();
      renderHistory();
    };

    item.onclick=()=>{
      loadChat(c.id);
      sidebar.classList.remove("open");
    };

    item.appendChild(name);
    item.appendChild(del);

    historyBox.appendChild(item);
  });
}

function showWelcome(){

  chat.innerHTML=`

  <div class="welcome">

    <div class="welcome-icon">✦</div>

    <h1>
      What can I<br>
      help you create?
    </h1>

    <p>
      あなたのための、シンプルで自由なAI。
    </p>

  </div>

  `;
}

function newChat(){

  currentId=null;
  messages=[];
  showWelcome();
  renderHistory();
  input.focus();
}

function loadChat(id){

  const c=conversations.find(x=>x.id===id);

  if(!c)return;

  currentId=id;
  messages=c.messages || [];

  chat.innerHTML="";

  messages.forEach(m=>{
    addMessage(m.content,m.role,false);
  });

  renderHistory();
}

function addMessage(text,type,scroll=true){

  const div=document.createElement("div");

  div.className=
    "message "+
    (type==="user"?"user":"ai");

  if(type==="user"){

    div.innerHTML=
      `<div class="user-bubble"></div>`;

    div.querySelector(".user-bubble")
      .textContent=text;

  }else{

    div.innerHTML=`

      <div class="ai-icon">✦</div>

      <div class="ai-content">

        <div class="answer"></div>

        <button class="copy-btn">
          コピー
        </button>

      </div>

    `;

    const answer=
      div.querySelector(".answer");

    answer.textContent=text;

    div.querySelector(".copy-btn").onclick=async()=>{

      await navigator.clipboard.writeText(text);

      div.querySelector(".copy-btn")
        .textContent="コピーしました";

      setTimeout(()=>{
        div.querySelector(".copy-btn")
          .textContent="コピー";
      },1200);

    };

  }

  chat.appendChild(div);

  if(scroll){
    chat.scrollTop=chat.scrollHeight;
  }
}

function makeTitle(text){

  return text.length>25
    ? text.slice(0,25)+"..."
    : text;
}

async function sendMessage(){

  const text=input.value.trim();

  if(!text || send.disabled)return;

  input.value="";
  input.style.height="42px";

  send.disabled=true;

  if(!currentId){

    currentId=Date.now().toString();

    conversations.unshift({
      id:currentId,
      title:makeTitle(text),
      messages:[]
    });

  }

  const conversation=
    conversations.find(x=>x.id===currentId);

  addMessage(text,"user");

  messages.push({
    role:"user",
    content:text
  });

  conversation.messages=messages;

  save();
  renderHistory();

  const loading=document.createElement("div");

  loading.className="message ai";

  loading.innerHTML=`

    <div class="ai-icon">✦</div>

    <div class="ai-content typing">
      考え中...
    </div>

  `;

  chat.appendChild(loading);

  chat.scrollTop=chat.scrollHeight;

  try{

    let style="";

    if(settings.personality==="friendly"){
      style="親しみやすく自然な日本語で答えて。";
    }

    if(settings.personality==="normal"){
      style="自然で分かりやすい日本語で答えて。";
    }

    if(settings.personality==="professional"){
      style="丁寧で専門的な日本語で答えて。";
    }

    if(settings.personality==="short"){
      style="できるだけ短く簡潔に答えて。";
    }

    if(settings.length==="short"){
      style+="回答は短めにして。";
    }

    if(settings.length==="long"){
      style+="必要なら詳しく説明して。";
    }

    const apiMessages=[
      {
        role:"user",
        content:
          `あなたはAnonymous AIというAIアシスタントです。
${style}
ユーザーとの会話の文脈を考慮して回答してください。`
      },
      ...messages
    ];

    const response=await fetch("/api/chat",{

      method:"POST",

      headers:{
        "Content-Type":"application/json"
      },

      body:JSON.stringify({
        messages:apiMessages
      })

    });

    const data=await response.json();

    if(!response.ok){
      throw new Error(
        data.error ||
        "AIとの接続に失敗しました"
      );
    }

    loading.remove();

    addMessage(data.text,"assistant");

    messages.push({
      role:"assistant",
      content:data.text
    });

    conversation.messages=messages;

    save();

  }catch(error){

    loading.remove();

    addMessage(
      "エラー："+error.message,
      "assistant"
    );

  }finally{

    send.disabled=false;
    input.focus();

  }
}

function toggleSidebar(){
  sidebar.classList.toggle("open");
}

function openSettings(){

  document.getElementById("settingsModal")
    .classList.add("open");

  document.getElementById("personality")
    .value=settings.personality;

  document.getElementById("length")
    .value=settings.length;
}

function closeSettings(){

  settings.personality=
    document.getElementById("personality").value;

  settings.length=
    document.getElementById("length").value;

  save();

  document.getElementById("settingsModal")
    .classList.remove("open");
}

function setTheme(name){

  settings.theme=name;

  document.documentElement
    .style.setProperty("--accent",themes[name][0]);

  document.documentElement
    .style.setProperty("--accent2",themes[name][1]);

  save();
}

function clearHistory(){

  if(!confirm("すべてのチャット履歴を削除する？")){
    return;
  }

  conversations=[];
  currentId=null;
  messages=[];

  save();
  renderHistory();
  showWelcome();
}

input.addEventListener("input",()=>{

  input.style.height="42px";

  input.style.height=
    Math.min(input.scrollHeight,150)+"px";

});

input.addEventListener("keydown",e=>{

  if(e.key==="Enter"&&!e.shiftKey){

    e.preventDefault();
    sendMessage();

  }

});

send.addEventListener("click",sendMessage);

document.getElementById("personality")
  .addEventListener("change",closeSettings);

document.getElementById("length")
  .addEventListener("change",closeSettings);

setTheme(settings.theme);

renderHistory();
showWelcome();

</script>

</body>
</html>
